nder para que serve a placa."],intro:['O Arduino é uma pequena placa com um "cérebro" eletrônico chamado microcontrolador. Ele segue as instruções que nós escrevemos: acender luzes, tocar sons, ler sensores e mover motores.',"Pense no Arduino como o cérebro de um robô: os sensores são os olhos e ouvidos, e os LEDs, buzzers e motores são a voz e os músculos.","Nesta missão você vai explorar a placa Arduino Uno e descobrir para que serve cada parte."],ideas:[{title:"Microcontrolador",text:'É o "cérebro". Guarda o programa e decide o que fazer.'},{title:"Pinos",text:"São os furinhos pretos nas bordas. Neles ligamos os fios dos componentes."},{title:"USB",text:"Por ele o Arduino recebe energia e o programa do computador."}],materials:[{item:"Placa Arduino Uno",qty:"1"},{item:"Cabo USB",qty:"1"}],safety:["Segure a placa pelas bordas e evite tocar nos componentes com os dedos.","Não coloque a placa sobre objetos de metal (clipes, moedas, estojo de metal): podem causar curto-circuito.","Ao terminar, desconecte o cabo USB puxando pelo conector, não pelo fio."],activity:{type:"arduino-find",intro:"Encontre cada parte na placa e clique nela. Se errar, o Faísca dá uma dica!",targets:[{part:"usb",prompt:"Onde o cabo USB é conectado?",explain:"A porta USB traz energia e o programa do computador."},{part:"micro",prompt:'Onde fica o microcontrolador, o "cérebro" da placa?',explain:"É o chip grande e comprido: ATmega328P."},{part:"5v",prompt:"Encontre o pino 5V.",explain:"O pino 5V fornece energia (5 volts) para os componentes."},{part:"gnd",prompt:"Encontre um pino GND.",explain:'GND é o negativo, o "caminho de volta" da eletricidade. A placa tem 3 pinos GND.'},{part:"digital",prompt:"Encontre os pinos digitais.",explain:"Os pinos digitais (0 a 13) ligam e desligam LEDs ou leem botões."}]},quiz:[{q:'Qual parte é o "cérebro" do Arduino, que guarda e executa o programa?',options:["A porta USB","O microcontrolador","O botão de reset","O conector de alimentação"],correct:1,explain:"O microcontrolador (ATmega328P) guarda o programa e executa as instruções."},{q:"O que significa GND?",options:["Um pino que liga LEDs automaticamente","O negativo do circuito, o caminho de volta da corrente","Uma porta para o cabo USB","Um tipo de sensor"],correct:1,explain:'GND (do inglês ground, "terra") é o negativo: 0 volt. Todo circuito precisa voltar ao GND.'},{q:"Quantos pinos digitais (numerados) o Arduino Uno tem?",options:["6","10","14 (de 0 a 13)","20"],correct:2,explain:"São 14 pinos digitais, numerados de 0 a 13. Seis deles (com ~) também fazem PWM."},{q:"Para que serve o botão de reset?",options:["Para apagar o programa da placa","Para recomeçar o programa do início","Para desligar o computador","Para aumentar a energia"],correct:1,explain:"O reset faz o programa começar de novo, do início. O programa NÃO é apagado."}],challenge:{text:'Com a placa real nas mãos, encontre: os 3 pinos GND, o pino 5V, o pino 3.3V e o LED "L". Mostre para um colega e explique para que serve cada um.',hint:"Dois GND ficam na barra de baixo, junto com 5V e 3.3V. O terceiro GND fica em cima, ao lado do pino 13.",solution:"GND: dois na barra POWER (embaixo) e um ao lado do pino 13 (em cima). 5V e 3.3V: barra POWER. LED L: perto do pino 13, ligado a esse pino."},teacher:{minutes:50,tips:["Distribua uma placa por dupla e peça para desenharem a placa no caderno, marcando 5V, GND e pinos digitais.","Use a analogia do corpo humano: cérebro (microcontrolador), boca/olhos (pinos), alimento (energia USB)."],difficulties:["Confundir 5V com VIN.","Achar que existe só um GND.","Pensar que o botão de reset apaga o programa."]}},{n:2,id:"m2",level:1,title:"Explorando a protoboard",icon:"🧩",xp:100,objective:"Entender como os furos da protoboard são ligados por dentro.",goals:["Entender os grupos de 5 furos.","Conhecer os trilhos de alimentação.","Entender o canal central."],intro:["A protoboard (ou matriz de contatos) serve para montar circuitos sem solda: é só encaixar as pernas dos componentes nos furos.","O segredo: por baixo dos furos existem tiras de metal que ligam alguns furos entre si. Na parte do meio, cada coluna tem dois grupos de 5 furos ligados (a–e e f–j).","Nas bordas ficam os trilhos de alimentação (+ vermelho e − azul), que são ligados ao longo de toda a placa. No meio há o canal central, que separa as duas metades."],ideas:[{title:"Grupo de 5",text:"Os furos a, b, c, d, e da mesma coluna estão ligados. O mesmo vale para f, g, h, i, j."},{title:"Trilhos",text:"As fileiras com + e − são ligadas de ponta a ponta. Usamos para 5V e GND."},{title:"Canal central",text:"O vão do meio NÃO tem ligação. Ele separa os lados de cima e de baixo."}],materials:[{item:"Protoboard",qty:"1"}],safety:["Encaixe as pernas dos componentes com cuidado, sem forçar, para não entortar os contatos internos.","Não coloque objetos de metal soltos (clipes, grampos) nos furos."],activity:{type:"proto-quiz",intro:"Para cada par de furos destacados, responda: eles estão ligados por dentro da protoboard?",items:[{a:"a3",b:"e3",connected:!0,explain:"a3 e e3 ficam na mesma coluna e na mesma metade: mesmo grupo de 5."},{a:"c7",b:"c8",connected:!1,explain:"Colunas diferentes (7 e 8) são grupos diferentes."},{a:"e12",b:"f12",connected:!1,explain:"O canal central separa e12 (metade de cima) de f12 (metade de baixo)."},{a:"tp-3",b:"tp-27",connected:!0,explain:"Os dois estão no mesmo trilho positivo, que vai de ponta a ponta."},{a:"tp-5",b:"tn-5",connected:!1,explain:"O trilho + e o trilho − são tiras diferentes. Ainda bem: senão seria um curto!"},{a:"g20",b:"j20",connected:!0,explain:"g20 e j20 estão no mesmo grupo de 5 (f a j da coluna 20)."}]},quiz:[{q:"Quais furos estão ligados ao furo b10?",options:["Todos da linha b","a10, c10, d10 e e10","f10, g10, h10, i10 e j10","Nenhum"],correct:1,explain:"b10 faz parte do grupo de 5 da coluna 10 na metade de cima: a10 a e10."},{q:"Os furos e5 e f5 estão ligados?",options:["Sim, estão na mesma coluna","Não, o canal central separa os dois"],correct:1,explain:"O canal central não tem ligação: a metade de cima e a de baixo são separadas."},{q:"Para que servem os trilhos com + e −?",options:["Para decorar a protoboard","Para distribuir a alimentação (5V e GND) por toda a placa","Para ligar a protoboard na tomada","Para guardar componentes"],correct:1,explain:"Ligamos o 5V no trilho + e o GND no trilho −. Assim temos energia em qualquer ponto da placa."},{q:"Posso colocar as duas pernas de um LED no mesmo grupo de 5 furos?",options:["Sim, assim ele acende mais","Não, as duas pernas ficariam ligadas juntas e o LED não acenderia"],correct:1,explain:"No mesmo grupo, as duas pernas estão ligadas pelo metal: a corrente passa pelo metal e não pelo LED."}],challenge:{text:'No Laboratório da Protoboard, ligue a opção "trilhos interrompidos" e descubra: o furo do trilho + da coluna 3 está ligado ao da coluna 27?',hint:"Clique em um furo do trilho e veja até onde vai o destaque colorido.",solution:"Não. Em protoboards com trilho interrompido no meio, a metade esquerda do trilho não se liga à direita. É preciso colocar um fio (jumper) ligando as duas metades."},teacher:{minutes:50,tips:["Se possível, mostre uma protoboard com a fita adesiva de baixo removida, para ver as tiras de metal.",'Projete o modo "Ver por dentro" do laboratório e peça para os estudantes preverem antes de clicar.',"Verifique se as protoboards da escola têm trilhos interrompidos no meio (há uma falha na linha vermelha/azul)."],difficulties:["Achar que os furos de uma mesma LINHA (letra) são ligados.","Esquecer que o canal central separa as metades.","Não saber que alguns trilhos são interrompidos."]}},{n:3,id:"m3",level:1,title:"Positivo e negativo",icon:"🔋",xp:100,objective:"Levar a energia da placa (5V e GND) até os trilhos da protoboard usando jumpers.",goals:["Entender alimentação elétrica.","Conhecer 5V e GND.","Aprender a utilizar os jumpers."],intro:["Para um componente funcionar, a eletricidade precisa sair do positivo (+), passar pelo componente e voltar para o negativo (−). Esse caminho completo se chama circuito.","No Arduino, o pino 5V é o positivo e o GND é o negativo. Vamos usar fios chamados jumpers para levar o 5V até o trilho + e o GND até o trilho − da protoboard.","Combinado de cores: fio VERMELHO para o 5V e fio PRETO para o GND. Isso evita confusões!"],ideas:[{title:"Tensão (V)",text:'É a "força" que empurra a eletricidade. O pino 5V empurra com 5 volts.'},{title:"Jumper",text:"Fio com pontas rígidas, feito para encaixar na protoboard e nos pinos."}],materials:[{item:"Placa Arduino Uno + cabo USB",qty:"1"},{item:"Protoboard",qty:"1"},{item:"Jumper vermelho (macho-macho)",qty:"1"},{item:"Jumper preto (macho-macho)",qty:"1"}],safety:[...zr,"Ligar 5V e GND no mesmo trilho é um curto-circuito: a placa pode esquentar e o fusível da USB desliga."],circuit:tp,steps:[{text:"Com o USB desligado, ligue um jumper VERMELHO do pino 5V da placa até um furo do trilho positivo (+, linha vermelha) da protoboard.",add:["p5"]},{text:"Ligue um jumper PRETO de um pino GND da placa até um furo do trilho negativo (−, linha azul).",add:["pg"],tip:"Agora todo o trilho + tem 5V e todo o trilho − é GND."}],activity:{type:"build",intro:'Na bancada virtual, use a ferramenta Fio para ligar o 5V ao trilho + e o GND ao trilho −. Depois clique em "Verificar montagem".',start:Go(),palette:[],rules:[{type:"rails"}],hint:"Os pinos 5V e GND ficam na barra POWER, na parte de baixo da placa."},quiz:[{q:"Qual pino do Arduino fornece o positivo de 5 volts?",options:["GND","5V","A0","RESET"],correct:1,explain:'O pino 5V fornece 5 volts. É o "positivo" dos nossos circuitos.'},{q:"Qual cor de fio combinamos usar para o GND?",options:["Vermelho","Amarelo","Preto","Qualquer uma, a cor muda a eletricidade"],correct:2,explain:"A cor do fio não muda a eletricidade, mas o combinado (preto = GND) ajuda a não errar."},{q:"O que acontece se ligarmos um fio direto do 5V ao GND?",options:["Nada","Um curto-circuito: muita corrente, aquecimento e risco de estragar a placa","O LED acende mais forte","O Arduino fica mais rápido"],correct:1,explain:"Sem nenhum componente no caminho, a corrente fica enorme. Isso é um curto-circuito. Nunca faça!"},{q:"Por que ligamos os trilhos à placa?",options:["Para ter 5V e GND disponíveis em vários pontos da protoboard","Para a protoboard ficar mais bonita","Para programar a placa"],correct:0,explain:"Com os trilhos alimentados, podemos pegar 5V e GND em qualquer lugar da protoboard."}],challenge:{text:"Alimente também os trilhos de CIMA da protoboard, usando só mais dois fios curtos (sem voltar à placa).",hint:"Um fio liga o trilho + de baixo ao + de cima. Outro liga o − de baixo ao − de cima.",solution:"Ligue um jumper vermelho entre o trilho + de baixo e o trilho + de cima, e um jumper preto entre o trilho − de baixo e o − de cima. Cuidado para não cruzar + com −!"},teacher:{minutes:50,tips:["Reforce o combinado de cores com um cartaz na sala: vermelho = 5V, preto = GND.",'Peça para as duplas falarem em voz alta "fio vermelho no 5V, fio preto no GND" antes de ligar.'],difficulties:["Ligar o 5V no trilho azul (−).","Usar o pino VIN ou 3.3V no lugar do 5V.","Encaixar o jumper no furo errado do trilho (outro trilho)."]}},{n:4,id:"m4",level:1,title:"Conhecendo o LED",icon:"💡",xp:100,objective:"Identificar o ânodo e o cátodo do LED e entender por que ele precisa de um resistor.",goals:["Identificar ânodo e cátodo.","Entender polaridade.","Conhecer o resistor.","Entender por que o resistor é necessário."],intro:["O LED é uma pequena lâmpada que acende quando a corrente passa por ele no sentido certo. Ele tem polaridade: uma perna é o + e a outra é o −.",'A perna LONGA é o ânodo (+). A perna CURTA é o cátodo (−). A borda da "cabeça" do LED também tem um lado chato, do lado do cátodo.',"O resistor é um componente que dificulta a passagem da corrente. Sem ele, passaria corrente demais e o LED (e até o pino do Arduino) poderia queimar. Usamos 220 Ω ou 330 Ω."],ideas:[{title:"Polaridade",text:"O LED só acende em um sentido: do ânodo (+) para o cátodo (−)."},{title:"Resistor",text:"Limita a corrente, como um registro que deixa passar só um pouco de água."},{title:"Em série",text:"Resistor e LED um depois do outro, no mesmo caminho."}],materials:[{item:"Arduino Uno + cabo USB",qty:"1"},{item:"Protoboard",qty:"1"},{item:"LED vermelho",qty:"1"},{item:"Resistor de 220 Ω (vermelho, vermelho, marrom)",qty:"1"},{item:"Jumpers",qty:"4"}],safety:Aa,circuit:fn,steps:[{text:"Ligue o 5V ao trilho + e o GND ao trilho − (como na Missão 03).",add:["p5","pg"]},{text:"Coloque o resistor de 220 Ω nos furos g5 e g9.",add:["r1"]},{text:"Coloque o LED: perna LONGA (ânodo) no furo h9 — mesmo grupo do resistor — e perna CURTA (cátodo) no furo h10.",add:["l1"]},{text:"Ligue um fio vermelho do trilho + até o furo j5 (grupo da outra perna do resistor).",add:["w3"]},{text:"Ligue um fio preto do furo j10 (grupo do cátodo) até o trilho −. Confira tudo e ligue o USB!",add:["w4"],tip:"Caminho: 5V → resistor → LED → GND."}],activity:{type:"build",intro:'Os trilhos já estão alimentados. Coloque um resistor e um LED e ligue tudo para o LED acender. Use "Ligar USB" para testar e "Verificar montagem" para conferir.',start:tp,palette:["led","resistor"],rules:[{type:"ledPowered"}],hint:"A perna longa do LED fica no mesmo grupo de 5 que uma perna do resistor. A outra perna do resistor vai ao +; a perna curta do LED vai ao −."},quiz:[{q:"Qual perna do LED é o ânodo (+)?",options:["A perna curta","A perna longa","Tanto faz"],correct:1,explain:"A perna longa é o ânodo (+). A curta é o cátodo (−)."},{q:"O que acontece se o LED for colocado ao contrário?",options:["Ele queima na hora","Ele não acende, mas também não estraga (com 5V)","Ele acende de outra cor"],correct:1,explain:"Invertido, o LED não deixa a corrente passar e fica apagado. É só desvirar."},{q:"Por que usamos um resistor junto com o LED?",options:["Para o LED piscar","Para limitar a corrente e proteger o LED e a placa","Para mudar a cor do LED","Não precisa de resistor"],correct:1,explain:"O resistor limita a corrente. Sem ele, a corrente ficaria alta demais."},{q:"Quais são as cores de um resistor de 220 Ω?",options:["Marrom, preto, laranja","Vermelho, vermelho, marrom","Amarelo, violeta, vermelho"],correct:1,explain:"Vermelho (2), vermelho (2), marrom (×10) = 220 Ω."}],challenge:{text:"Troque o resistor de 220 Ω por um de 1 kΩ (marrom, preto, vermelho). O que acontece com o brilho do LED? Por quê?",hint:"Um resistor maior deixa passar mais ou menos corrente?",solution:"O LED fica mais fraco: um resistor maior deixa passar menos corrente. Na bancada virtual dá para ver a corrente cair de cerca de 13 mA para cerca de 3 mA."},teacher:{minutes:50,tips:["Mostre um LED de perto: perna longa, perna curta e o lado chato.","Se um LED tiver as pernas cortadas no mesmo tamanho, use o lado chato da borda para achar o cátodo."],difficulties:["Colocar as duas pernas do LED no mesmo grupo de 5.","Esquecer o resistor.","Inverter o LED."]}},{n:5,id:"m5",level:1,title:"Meu primeiro circuito",icon:"⚡",xp:100,objective:"Montar um circuito completo, alimentá-lo e encontrar erros de montagem.",goals:["Montar um circuito completo.","Conectar corretamente o LED e o resistor.","Alimentar o circuito.","Observar o LED acender."],intro:["Agora você vai montar sozinho o circuito completo e também virar um detetive: encontrar e corrigir erros em uma montagem.","Lembre do caminho da eletricidade: ela sai do 5V, passa pelo resistor, passa pelo LED (do ânodo para o cátodo) e volta para o GND. Se o caminho estiver interrompido em qualquer ponto, o LED não acende. Isso é um circuito aberto."],ideas:[{title:"Circuito fechado",text:"O caminho está completo: a corrente circula e o LED acende."},{title:"Circuito aberto",text:"Falta uma ligação: a corrente não circula."}],materials:[{item:"Arduino Uno + cabo USB",qty:"1"},{item:"Protoboard",qty:"1"},{item:"LED",qty:"1"},{item:"Resistor de 220 Ω",qty:"1"},{item:"Jumpers",qty:"4"}],safety:Aa,circuit:fn,steps:[{text:"Alimente os trilhos: 5V no + e GND no −.",add:["p5","pg"]},{text:"Resistor de 220 Ω nos furos g5 e g9.",add:["r1"]},{text:"LED com a perna longa em h9 e a curta em h10.",add:["l1"]},{text:"Fio do trilho + até j5.",add:["w3"]},{text:"Fio do furo j10 até o trilho −. Ligue o USB e veja o LED acender!",add:["w4"]}],activity:{type:"build",intro:'Esta montagem tem DOIS erros. Ligue o USB, observe, encontre os erros e corrija. Depois clique em "Verificar montagem".',start:my,palette:["led","resistor"],rules:[{type:"ledPowered"}],hint:"Selecione o LED e veja onde está cada perna. Depois siga o caminho até o GND: falta alguma coisa?"},quiz:[{q:"O LED não acendeu. Qual é a PRIMEIRA coisa a fazer antes de mexer no circuito?",options:["Puxar todos os fios rapidamente","Desligar o cabo USB","Trocar a placa"],correct:1,explain:"Sempre desligue a alimentação antes de alterar as conexões."},{q:"O que é um circuito aberto?",options:["Um circuito sem tampa","Um circuito com o caminho interrompido, onde a corrente não circula","Um circuito com muitos LEDs"],correct:1,explain:"Se falta uma ligação, a corrente não tem por onde voltar: o circuito está aberto."},{q:"Neste circuito, o resistor pode ficar antes ou depois do LED?",options:["Só antes","Só depois","Tanto faz: em série, a corrente é a mesma"],correct:2,explain:"Em série, a mesma corrente passa pelos dois. O resistor protege o LED nas duas posições."}],challenge:{text:"Monte um segundo LED, de outra cor, também alimentado pelos trilhos, com seu próprio resistor. Os dois devem acender juntos.",hint:"Repita o mesmo caminho em outras colunas: + → resistor → LED → −.",solution:"Cada LED precisa de seu próprio resistor. Exemplo: resistor em g18–g22, LED em h22 (longa) e h23 (curta), fio do + até j18 e fio de j23 até o −."},teacher:{minutes:50,tips:["Peça às duplas para traçarem com o dedo o caminho da corrente antes de ligar.",'Mostre o "Caminho da eletricidade" na bancada virtual para discutir circuito aberto e fechado.'],difficulties:["Esquecer o fio do GND.","LED invertido.","Fio no furo vizinho (coluna errada)."]}},{n:6,id:"m6",level:2,title:"O Arduino também programa!",icon:"🧠",xp:120,objective:"Conhecer o Arduino IDE e a estrutura básica de um programa: setup() e loop().",goals:["Conhecer o Arduino IDE.","Entender o que é um programa.","Conhecer a estrutura básica de um código."],intro:["Um programa é uma lista de instruções, escrita em uma ordem certa, que o Arduino segue sem se cansar. Escrevemos o programa no computador, no Arduino IDE, e enviamos para a placa pelo cabo USB.","Todo programa do Arduino tem duas partes: o setup(), que roda UMA vez quando a placa liga, e o loop(), que se repete PARA SEMPRE.",'No Arduino IDE: escreva o código, clique em ✔ (Verificar) para procurar erros e em ➜ (Carregar) para enviar à placa. Antes, escolha a placa "Arduino Uno" e a porta USB no menu Ferramentas.'],ideas:[{title:"setup()",text:"Preparação. Roda uma vez, como arrumar a mochila antes da aula."},{title:"loop()",text:"Repetição. Roda sem parar, como o coração batendo."},{title:"{ } e ;",text:"As chaves guardam as instruções de cada parte. O ponto e vírgula termina cada instrução."}],materials:[{item:"Computador com Arduino IDE",qty:"1"},{item:"Arduino Uno + cabo USB",qty:"1"}],safety:["Conecte o cabo USB com cuidado, sem forçar o encaixe.","Não coloque a placa ligada sobre superfícies de metal."],code:`// Meu primeiro programa
// Abra o Monitor Serial (lupa no canto do Arduino IDE) para ver as mensagens.

void setup() {
  // Tudo aqui dentro roda UMA vez, quando a placa liga.
  Serial.begin(9600);
  Serial.println("Ola! Eu sou o Arduino.");
}

void loop() {
  // Tudo aqui dentro se repete PARA SEMPRE.
  Serial.println("Estou funcionando...");
  delay(2000);
}`,codeExplain:[{code:"// texto",text:"Comentário: anotação para pessoas. O Arduino ignora tudo depois de //."},{code:"void setup() { }",text:"Parte de preparação: roda uma vez."},{code:"Serial.begin(9600);",text:"Liga a conversa com o computador na velocidade 9600."},{code:'Serial.println("...");',text:"Escreve uma mensagem no Monitor Serial."},{code:"void loop() { }",text:"Parte que se repete para sempre."},{code:"delay(2000);",text:"Espera 2000 milissegundos (2 segundos)."}],activity:{type:"code-order",intro:"As linhas do programa ficaram embaralhadas! Arraste (ou use as setas) para colocar na ordem certa.",lines:["void setup() {","  Serial.begin(9600);",'  Serial.println("Ola!");',"}","void loop() {",'  Serial.println("Funcionando");',"  delay(2000);","}"]},quiz:[{q:"Quantas vezes o código dentro de setup() é executado?",options:["Nenhuma","Uma vez, quando a placa liga","Para sempre"],correct:1,explain:"O setup() roda uma única vez, no começo."},{q:"E o código dentro de loop()?",options:["Uma vez","Duas vezes","Repete para sempre, enquanto a placa estiver ligada"],correct:2,explain:"O loop() recomeça assim que termina, sem parar."},{q:"Para que serve o ponto e vírgula ( ; )?",options:["Para enfeitar","Para terminar cada instrução","Para começar um comentário"],correct:1,explain:"O ; avisa onde termina cada instrução, como o ponto final de uma frase."},{q:"O que o Arduino faz com o texto depois de // ?",options:["Executa como comando","Ignora: é um comentário para pessoas lerem","Mostra na tela"],correct:1,explain:"Comentários ajudam a explicar o código e não são executados."}],challenge:{text:"Mude o programa para mostrar seu apelido (ou o nome da equipe) no Monitor Serial e para escrever a mensagem do loop a cada 1 segundo.",hint:"Troque o texto entre aspas e o número dentro do delay().",solution:'Serial.println("Equipe Faísca"); no setup() e delay(1000); no loop().',solutionCode:`void setup() {
  Serial.begin(9600);

}

void loop() {
  Serial.println("Estou funcionando...");
  delay(1000);
}`},teacher:{minutes:50,tips:["Antes da aula, instale o Arduino IDE e teste a porta USB em cada computador.",'Faça os estudantes "executarem" o programa como robôs: um lê o setup uma vez e o loop várias vezes.',"Se a sala não tiver placas suficientes, use o simulador desta plataforma."],difficulties:["Esquecer de selecionar a placa e a porta no Arduino IDE.","Apagar uma chave { } ou um ;.","Escrever setup com letra maiúscula (Setup)."]}},{n:7,id:"m7",level:2,title:"Fazendo o LED piscar",icon:"✨",xp:120,objective:"Programar o Arduino para acender e apagar um LED usando pinMode, digitalWrite e delay.",goals:["Usar setup() e loop().","Configurar um pino com pinMode().","Ligar e desligar com digitalWrite().","Controlar o tempo com delay()."],intro:["Agora o LED vai ser controlado pelo programa! Em vez de ligar o LED no 5V, vamos ligá-lo em um pino digital: o pino 13.","No programa, dizemos que o pino 13 é uma SAÍDA (OUTPUT). Depois mandamos o pino ficar em HIGH (5 V, LED aceso) ou LOW (0 V, LED apagado), esperando um tempo entre uma coisa e outra.",'Curiosidade: o LED "L" da própria placa também é ligado ao pino 13. Ele vai piscar junto!'],ideas:[{title:"pinMode(13, OUTPUT)",text:"Avisa que o pino 13 vai ser uma saída."},{title:"digitalWrite(13, HIGH)",text:"Liga o pino 13: 5 volts saem por ele."},{title:"delay(1000)",text:"Espera 1000 milissegundos = 1 segundo."}],materials:[{item:"Arduino Uno + cabo USB",qty:"1"},{item:"Protoboard",qty:"1"},{item:"LED vermelho",qty:"1"},{item:"Resistor de 220 Ω",qty:"1"},{item:"Jumpers",qty:"3"}],safety:Aa,circuit:Dt,steps:[ps,...Oe("a","D13",2,"vermelho",6)],code:`// Missão 07 — Fazendo o LED piscar
// LED (com resistor de 220 Ω) ligado ao pino 13

void setup() {
  pinMode(13, OUTPUT);      // o pino 13 será uma SAÍDA
}

void loop() {
  digitalWrite(13, HIGH);   // liga o pino 13 (5 V): LED aceso
  delay(1000);              // espera 1000 ms = 1 segundo
  digitalWrite(13, LOW);    // desliga o pino 13 (0 V): LED apagado
  delay(1000);              // espera mais 1 segundo
}`,codeExplain:[{code:"pinMode(13, OUTPUT);",text:"Configura o pino 13 como saída. Fica no setup(), porque basta fazer uma vez."},{code:"digitalWrite(13, HIGH);",text:"HIGH = alto = 5 V. A corrente sai do pino, passa pelo resistor e pelo LED e volta pelo GND."},{code:"delay(1000);",text:"O Arduino espera 1 segundo com o LED aceso."},{code:"digitalWrite(13, LOW);",text:"LOW = baixo = 0 V. Sem tensão, o LED apaga."}],activity:{type:"build",intro:"Monte o LED com resistor no pino 13. Ligue o USB para ver o programa rodando e verifique a montagem.",start:Go(),palette:["led","resistor"],rules:[{type:"ledPin",pin:"D13"}],hint:"Caminho: pino 13 → resistor → perna longa do LED → perna curta → GND."},quiz:[{q:"O que faz pinMode(13, OUTPUT)?",options:["Acende o LED","Configura o pino 13 como saída","Lê o pino 13"],correct:1,explain:"pinMode só configura. Quem liga e desliga é o digitalWrite."},{q:"Se trocarmos delay(1000) por delay(250), o LED vai piscar…",options:["mais devagar","mais rápido","do mesmo jeito"],correct:1,explain:"250 ms é menos tempo de espera: o LED pisca 4 vezes mais rápido."},{q:"O que significa LOW no digitalWrite?",options:["5 volts","0 volt (desligado)","Metade do brilho"],correct:1,explain:"LOW = 0 V. HIGH = 5 V."},{q:"Por que o pinMode fica no setup() e não no loop()?",options:["Porque basta configurar o pino uma vez","Porque no loop dá erro","Porque o loop não roda"],correct:0,explain:"A configuração não muda: fazer uma vez no setup() é suficiente."}],challenge:{text:"Faça o LED piscar como um sinal de SOS em código Morse: 3 piscadas curtas, 3 longas e 3 curtas.",hint:"Curta: aceso 200 ms. Longa: aceso 600 ms. Entre piscadas, apagado 200 ms.",solution:"Repita digitalWrite HIGH / delay / digitalWrite LOW / delay com tempos curtos (200) e longos (600). Na Missão 16 você vai aprender a usar o for para não repetir tanto!",solutionCode:`void setup() {
  pinMode(13, OUTPUT);
}

void loop() {
  // S: 3 curtas
  digitalWrite(13, HIGH); delay(200); digitalWrite(13, LOW); delay(200);
  digitalWrite(13, HIGH); delay(200); digitalWrite(13, LOW); delay(200);
  digitalWrite(13, HIGH); delay(200); digitalWrite(13, LOW); delay(200);
  // O: 3 longas
  digitalWrite(13, HIGH); delay(600); digitalWrite(13, LOW); delay(200);
  digitalWrite(13, HIGH); delay(600); digitalWrite(13, LOW); delay(200);
  digitalWrite(13, HIGH); delay(600); digitalWrite(13, LOW); delay(200);
  // S: 3 curtas
  digitalWrite(13, HIGH); delay(200); digitalWrite(13, LOW); delay(200);
  digitalWrite(13, HIGH); delay(200); digitalWrite(13, LOW); delay(200);
  digitalWrite(13, HIGH); delay(200); digitalWrite(13, LOW); delay(200);
  delay(1500);
}`},teacher:{minutes:50,tips:["Mostre que o LED L da placa pisca junto com o LED da protoboard (ambos no pino 13).","Peça para mudarem só o delay e preverem o resultado antes de enviar."],difficulties:["Esquecer o pinMode: o LED fica muito fraco.","Faltar ; no fim das linhas.","Erro de upload por porta não selecionada."]}},{n:8,id:"m8",level:2,title:"Controlando dois LEDs",icon:"🚦",xp:120,objective:"Ligar dois LEDs em pinos diferentes e controlar cada um separadamente.",goals:["Conectar dois LEDs em pinos diferentes.","Controlar cada LED individualmente.","Compreender HIGH e LOW."],intro:["Cada pino digital pode controlar um LED diferente. Com dois LEDs (pinos 13 e 12), podemos acender um, apagar o outro, e criar efeitos.","Cada LED continua precisando do seu próprio resistor. Os dois cátodos (pernas curtas) podem ir para o mesmo trilho −, que está ligado ao GND."],ideas:[{title:"HIGH",text:"Pino ligado: 5 V. O LED daquele pino acende."},{title:"LOW",text:"Pino desligado: 0 V. O LED daquele pino apaga."}],materials:[{item:"Arduino Uno + cabo USB",qty:"1"},{item:"Protoboard",qty:"1"},{item:"LED vermelho e LED verde",qty:"2"},{item:"Resistores de 220 Ω",qty:"2"},{item:"Jumpers",qty:"5"}],safety:Aa,circuit:py,steps:[ps,...Oe("a","D13",2,"vermelho",6),...Oe("b","D12",11,"verde",13)],code:`// Missão 08 — Controlando dois LEDs
// LED vermelho no pino 13 e LED verde no pino 12 (cada um com resistor de 220 Ω)

void setup() {
  pinMode(13, OUTPUT);
  pinMode(12, OUTPUT);
}

void loop() {
  digitalWrite(13, HIGH);   // vermelho aceso

  digitalWrite(12, HIGH);   // verde aceso
  delay(500);
}`,codeExplain:[{code:"pinMode(12, OUTPUT);",text:"Cada pino usado como saída precisa do seu pinMode."},{code:`digitalWrite(13, HIGH);
digitalWrite(12, LOW);`,text:"Um aceso e outro apagado ao mesmo tempo. As duas instruções são tão rápidas que parecem simultâneas."}],activity:{type:"build",intro:"Monte o LED vermelho no pino 13 e o LED verde no pino 12. Ligue o USB e veja a alternância.",start:Go(),palette:["led","resistor"],rules:[{type:"ledPin",pin:"D13",color:"red"},{type:"ledPin",pin:"D12",color:"green"}],hint:"Selecione um LED para trocar a cor. Faça dois caminhos iguais em colunas diferentes."},quiz:[{q:"Dois LEDs podem usar o mesmo resistor no lugar de um resistor para cada?",options:["É melhor cada LED ter o seu resistor","Não precisa de resistor com dois LEDs"],correct:0,explain:"Cada LED com seu resistor garante a corrente certa em cada um."},{q:"No código, o que faz o LED verde acender?",options:["digitalWrite(12, HIGH);","digitalWrite(13, HIGH);","pinMode(12, OUTPUT);"],correct:0,explain:"O verde está no pino 12: digitalWrite(12, HIGH) o acende."},{q:"Para os dois LEDs ficarem acesos juntos, o que precisa estar no código?",options:["Os dois pinos em HIGH ao mesmo tempo","Um pino em HIGH e o outro em LOW","Só o pinMode"],correct:0,explain:"Com os dois pinos em HIGH, os dois LEDs acendem."}],challenge:{text:"Crie uma sequência luminosa: os dois acesos, os dois apagados, só o vermelho, só o verde — e repita.",hint:'Escreva cada "quadro" da sequência com dois digitalWrite e um delay.',solution:"Quatro blocos de dois digitalWrite + delay, um para cada momento da sequência.",solutionCode:`void setup() {
  pinMode(13, OUTPUT);
  pinMode(12, OUTPUT);
}

void loop() {
  digitalWrite(13, HIGH); digitalWrite(12, HIGH); delay(400);  // os dois
  digitalWrite(13, LOW);  digitalWrite(12, LOW);  delay(400);  // nenhum
  digitalWrite(13, HIGH); digitalWrite(12, LOW);  delay(400);  // vermelho
  digitalWrite(13, LOW);  digitalWrite(12, HIGH); delay(400);  // verde
}`},teacher:{minutes:50,tips:["Proponha que cada dupla invente uma sequência e a desafie a outra dupla a adivinhar o padrão."],difficulties:["Trocar os números dos pinos no código e na montagem.","Usar um único resistor para os dois LEDs."]}},{n:9,id:"m9",level:2,title:"Criando um semáforo",icon:"🚥",xp:120,objective:"Programar uma sequência com três LEDs, como um semáforo de verdade.",goals:["Utilizar três LEDs.","Programar uma sequência.","Alterar os intervalos.","Entender a ordem das instruções."],intro:["O semáforo segue sempre a mesma ordem: verde (siga), amarelo (atenção) e vermelho (pare). O Arduino executa as instruções de cima para baixo, uma de cada vez, e é essa ordem que cria a sequência.","Vamos usar o vermelho no pino 13, o amarelo no 12 e o verde no 11."],ideas:[{title:"Sequência",text:"O programa roda as linhas na ordem em que foram escritas."},{title:"Intervalos",text:"Os números no delay definem quanto tempo cada luz fica acesa."}],materials:[{item:"Arduino Uno + cabo USB",qty:"1"},{item:"Protoboard",qty:"1"},{item:"LEDs vermelho, amarelo e verde",qty:"3"},{item:"Resistores de 220 Ω",qty:"3"},{item:"Jumpers",qty:"7"}],safety:Aa,circuit:cu,steps:[ps,...Oe("a","D13",2,"vermelho",6),...Oe("b","D12",11,"amarelo",13),...Oe("c","D11",20,"verde",25)],code:`// Missão 09 — Semáforo
// Vermelho no pino 13, amarelo no 12, verde no 11

  pinMode(13, OUTPUT);
  pinMode(12, OUTPUT);
  pinMode(11, OUTPUT);
}

void loop() {
  // VERDE: os carros podem passar
  digitalWrite(11, HIGH);
  delay(4000);
  digitalWrite(11, LOW);

  // AMARELO: atenção!
  digitalWrite(12, HIGH);
  delay(1500);
  digitalWrite(12, LOW);

  // VERMELHO: pare
  digitalWrite(13, HIGH);
  delay(4000);
  digitalWrite(13, LOW);
}`,codeExplain:[{code:`digitalWrite(11, HIGH);

// HC-SR04: VCC → 5V, TRIG → pino 9, ECHO → pino 10, GND → GND. LED no pino 13.

const int trig = 9;
const int echo = 10;

void setup() {
  pinMode(trig, OUTPUT);
  pinMode(echo, INPUT);
  pinMode(13, OUTPUT);
  Serial.begin(9600);
}

void loop() {
  // 1) dispara um pulso de 10 microssegundos no TRIG
  digitalWrite(trig, LOW);
  delayMicroseconds(2);
  digitalWrite(trig, HIGH);
  delayMicroseconds(10);
  digitalWrite(trig, LOW);

  // 2) mede quanto tempo (em microssegundos) o eco demora para voltar
  long duracao = pulseIn(echo, HIGH);

  // 3) o som anda 0,034 cm por microssegundo; dividimos por 2 (ida e volta)
  int distancia = duracao * 0.034 / 2;

  Serial.print("Distancia: ");
  Serial.print(distancia);
  Serial.println(" cm");

  if (distancia < 20) {
    digitalWrite(13, HIGH);   // objeto perto: acende o LED
  } else {
    digitalWrite(13, LOW);
  }
  delay(100);
}`,Ey=[{n:11,id:"m11",level:3,title:"Conhecendo as variáveis",icon:"📦",xp:140,objective:"Criar uma variável do tipo int e usá-la como contador.",goals:["Entender o que é uma variável.","Saber para que serve.","Armazenar valores.","Utilizar int."],intro:["Uma variável é como uma caixinha com um nome, onde o Arduino guarda um valor para usar depois. O valor pode mudar enquanto o programa roda — por isso se chama variável.","Para criar uma variável dizemos o TIPO, o NOME e o valor inicial. Exemplo: int contador = 0; cria uma caixinha chamada contador, que guarda números inteiros e começa com zero.","Vamos fazer um contador de piscadas e ver os números no Monitor Serial."],ideas:[{title:"int",text:"Tipo para números inteiros (sem vírgula), de −32768 a 32767 no Arduino Uno."},{title:"contador = contador + 1;",text:"Pega o valor atual, soma 1 e guarda de novo na mesma caixinha."}],materials:[{item:"Arduino Uno + cabo USB",qty:"1"},{item:"LED + resistor de 220 Ω no pino 13",qty:"1"},{item:"Jumpers",qty:"3"}],safety:Zt,circuit:Dt,steps:[ea,...Oe("a","D13",2,"vermelho",6)],code:`// Missão 11 — Conhecendo as variáveis

  pinMode(2, INPUT_PULLUP);
  pinMode(13, OUTPUT);
  pinMode(12, OUTPUT);

}`,codeExplain:[{code:"int botao = digitalRead(2);",text:"Guarda a leitura numa variável para usar na decisão."},{code:"if (botao == LOW) {",text:'Com INPUT_PULLUP, apertado = LOW. A condição pergunta: "o botão está apertado?"'},{code:"} else {",text:"Caso contrário (botão solto), faz o outro bloco."}],activity:{type:"build",intro:"O botão e o LED vermelho da Missão 10 já estão montados. Adicione o LED verde no pino 12 e teste o porteiro.",start:gi,palette:["led","resistor","button"],rules:[{type:"buttonPin",pin:"D2"},{type:"ledPin",pin:"D13",color:"red"},{type:"ledPin",pin:"D12",color:"green"}],hint:"Monte o LED verde igual ao vermelho, em outras colunas, ligado ao pino 12."},quiz:[{q:"Qual a diferença entre = e == ?",options:["Nenhuma","= guarda um valor; == compara dois valores","== guarda um valor; = compara"],correct:1,explain:"x = 5 guarda 5 em x. x == 5 pergunta se x é igual a 5."},{q:"Quando o bloco do else é executado?",options:["Sempre","Quando a condição do if é falsa","Antes do if"],correct:1,explain:"O else roda só quando a condição do if não é verdadeira."},{q:'Que situação do dia a dia é um "if/else"?',options:["Se o sinal está verde, atravesso; senão, espero","Escovar os dentes","Contar até 10"],correct:0,explain:"É uma decisão com duas saídas, igual ao if/else."}],challenge:{text:'Crie uma "senha": o verde só acende se o botão ficar apertado por mais de 2 segundos.',hint:"Use uma variável para contar quanto tempo o botão ficou apertado (some 100 a cada 100 ms) e zere quando ele for solto.",solution:"Uma variável tempo aumenta enquanto o botão está apertado; se tempo >= 2000 acende o verde; ao soltar, tempo = 0.",solutionCode:`int tempo = 0;

// LEDs nos pinos 11, 12 e 13 (cada um com resistor de 220 Ω).

void setup() {
  for (int pino = 11; pino <= 13; pino++) {
    pinMode(pino, OUTPUT);       // configura os 3 pinos com uma só linha
  }
}

void loop() {
  // acende um LED de cada vez, do pino 11 até o 13
  for (int pino = 11; pino <= 13; pino++) {
    digitalWrite(pino, HIGH);
    delay(300);
    digitalWrite(pino, LOW);
  }

  // pisca todos juntos 3 vezes
  int vezes = 0;
  while (vezes < 3) {
    digitalWrite(11, HIGH);
    digitalWrite(12, HIGH);
    digitalWrite(13, HIGH);
    delay(200);
    digitalWrite(11, LOW);
    digitalWrite(12, LOW);
    digitalWrite(13, LOW);
    delay(200);
    vezes++;
  }
}`,codeExplain:[{code:"for (int pino = 11; pino <= 13; pino++)",text:"A variável pino começa em 11, repete enquanto for até 13 e aumenta 1 a cada volta: 11, 12, 13."},{code:"digitalWrite(pino, HIGH);",text:"Usa a variável: em cada volta, um pino diferente."},{code:"while (vezes < 3) { ... vezes++; }",text:"Repete enquanto vezes for menor que 3. O vezes++ garante que a repetição termina."}],activity:{type:"code-fill",intro:"Complete o for para que ele passe pelos pinos 11, 12 e 13.",template:`void setup() {

}

    digitalWrite(pino, LOW);
  }

// Servo no pino 9 (marrom → GND, vermelho → 5V). Botão no pino 2 e no GND.

#include <Servo.h>

Servo cancela;

void setup() {
  pinMode(2, INPUT_PULLUP);   // botão no pino 2
  cancela.attach(9);

  }
}`,codeExplain:[{code:"cancela.write(0);  // no setup",text:"Garante que a cancela começa fechada."},{code:"if (digitalRead(2) == LOW)",text:"Apertado = LOW, por causa do INPUT_PULLUP."},{code:"delay(3000);",text:"Tempo para o carro passar antes de fechar."}],activity:{type:"build",intro:"O servo já está montado. Adicione o botão no pino 2 (e no GND). Ligue o USB e aperte o botão para abrir a cancela.",start:ap,palette:["button","servo"],rules:[{type:"servoPin",pin:"D9"},{type:"buttonPin",pin:"D2"}],hint:"Botão sobre o canal; pino 2 em uma perna e GND na perna do outro lado."},quiz:[{q:"Por que usamos cancela.write(0) no setup()?",options:["Para a cancela começar fechada","Para abrir a cancela","Para ler o botão"],correct:0,explain:"Assim a posição inicial é conhecida."},{q:"O que aconteceria sem o delay(3000)?",options:["A cancela abriria e fecharia tão rápido que quase não se moveria","A cancela ficaria aberta para sempre","Nada muda"],correct:0,explain:"O servo precisa de tempo para chegar à posição e o carro para passar."}],challenge:{text:'Adicione um LED: vermelho com a cancela fechada e apagado com ela aberta (ou use um LED verde para "aberta").',hint:"Acenda/apague o LED junto com cada cancela.write().",solution:"digitalWrite(13, LOW) ao abrir e digitalWrite(13, HIGH) ao fechar, com pinMode(13, OUTPUT) no setup."},teacher:{minutes:70,tips:["Cole um palito de sorvete no braço do servo para virar a cancela.",'Monte uma "rua" de papelão para as equipes testarem.'],difficulties:["Servo sem GND comum com o botão (todos os GND devem estar ligados).","Botão do mesmo lado."]}},{n:19,id:"m19",level:4,title:"Detectando objetos",icon:"📡",xp:160,objective:"Medir distâncias com o sensor ultrassônico HC-SR04.",goals:["Conhecer o sensor ultrassônico HC-SR04.","Entender os pinos TRIG e ECHO.","Calcular distância.","Trabalhar condições."],intro:["O HC-SR04 funciona como um morcego: emite um som agudo que não escutamos (ultrassom) e espera o eco voltar. Quanto mais longe o objeto, mais o eco demora.","Pinos: VCC (5V), TRIG (o Arduino manda o sensor apitar), ECHO (o sensor avisa quanto tempo o eco demorou) e GND.","O som anda cerca de 0,034 cm por microssegundo. Como ele vai e volta, a distância é: tempo × 0,034 ÷ 2. O sensor mede de cerca de 2 cm a 4 m."],ideas:[{title:"TRIG",text:'Pulso de 10 microssegundos = "apite agora!"'},{title:"ECHO",text:"Fica em HIGH pelo tempo que o eco demorou. Medimos com pulseIn()."},{title:"distância = tempo × 0,034 ÷ 2",text:"Dividimos por 2 porque o som vai e volta."}],materials:[{item:"Arduino Uno + cabo USB",qty:"1"},{item:"Sensor ultrassônico HC-SR04",qty:"1"},{item:"LED + resistor de 220 Ω",qty:"1"},{item:"Jumpers",qty:"7"}],safety:[...Zt,"Confira VCC e GND do sensor antes de ligar: invertidos podem danificar o HC-SR04."],circuit:vy,steps:[ea,...Oe("a","D13",2,"vermelho",6),{text:"Encaixe o sensor com os pinos em a20 (VCC), a21 (TRIG), a22 (ECHO) e a23 (GND).",add:["us"]},{text:"Ligue e20 (VCC) ao 5V da placa.",add:["uw1"]},{text:"Ligue e21 (TRIG) ao pino 9 e e22 (ECHO) ao pino 10.",add:["uw2","uw3"]},{text:"Ligue e23 (GND) ao trilho −.",add:["uw4"]}],code:rp,codeExplain:[{code:`digitalWrite(trig, HIGH);
delayMicroseconds(10);
digitalWrite(trig, LOW);`,text:"Pulso de 10 µs no TRIG: o sensor emite o ultrassom."},{code:"long duracao = pulseIn(echo, HIGH);",text:"Mede, em microssegundos, quanto tempo o ECHO ficou em HIGH (ida e volta do som)."},{code:"int distancia = duracao * 0.034 / 2;",text:"Converte o tempo em centímetros."},{code:"if (distancia < 20)",text:"Decisão: objeto a menos de 20 cm acende o LED."}],activity:{type:"build",intro:"Monte o sensor (TRIG no pino 9, ECHO no 10) e o LED no pino 13. Ligue o USB e mude a distância do objeto selecionando o sensor.",start:Go(),palette:["ultrasonic","led","resistor"],rules:[{type:"ultrasonic",trig:"D9",echo:"D10"},{type:"ledPin",pin:"D13"}],hint:"VCC → 5V, TRIG → 9, ECHO → 10, GND → GND."},quiz:[{q:"Qual pino do HC-SR04 o Arduino usa para mandar o sensor emitir o som?",options:["ECHO","TRIG","VCC"],correct:1,explain:"TRIG (trigger = gatilho) dispara a medição."},{q:"Se o eco demorou 1000 microssegundos, qual a distância aproximada?",options:["17 cm","34 cm","1000 cm"],correct:0,explain:"1000 × 0,034 ÷ 2 = 17 cm."},{q:"Por que dividimos por 2?",options:["Porque o som vai até o objeto e volta",'Porque o sensor tem 2 "olhos"',"Para o número ficar menor"],correct:0,explain:"O tempo medido é de ida e volta."}],challenge:{text:"Crie um sensor de estacionamento: um buzzer que apita mais rápido quanto mais perto o objeto estiver.",hint:"Use a distância como tempo do delay entre os bipes: quanto menor a distância, menor o delay. Ligue um buzzer no pino 8 (com resistor de 100 Ω).",solution:"Se distancia < 50: tone(8, 1000), delay(50), noTone(8) e delay(distancia * 10).",solutionCode:rp.replace(`  if (distancia < 20) {
