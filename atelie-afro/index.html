<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Ateliê Afro — 50 desenhos, infinitas cores!</title>
  <meta name="description" content="Aplicativo de colorir com 50 desenhos que valorizam a identidade negra e a cultura afro-brasileira.">
  <meta name="theme-color" content="#7B2FBE">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- ============ TELA INICIAL ============ -->
  <section id="tela-inicio" class="tela ativa" aria-label="Tela inicial">
    <div class="inicio-topo">
      <button class="btn-redondo" id="btn-som-inicio" aria-label="Ligar ou desligar o som" data-acao="som"></button>
      <button class="btn-redondo" id="btn-config" aria-label="Opções do professor"></button>
    </div>
    <div class="inicio-conteudo">
      <h1 class="logo" aria-label="Ateliê Afro">
        <span class="logo-l" style="--c:#FFC21A">A</span><span class="logo-l" style="--c:#FF7A1A">T</span><span class="logo-l" style="--c:#FF4F8B">E</span><span class="logo-l" style="--c:#B04BE0">L</span><span class="logo-l" style="--c:#3D7BFF">I</span><span class="logo-l" style="--c:#18B46B">Ê</span>
        <span class="logo-espaco"></span>
        <span class="logo-l" style="--c:#FF4F8B">A</span><span class="logo-l" style="--c:#FFC21A">F</span><span class="logo-l" style="--c:#18B46B">R</span><span class="logo-l" style="--c:#FF7A1A">O</span>
      </h1>
      <p class="slogan">50 desenhos, infinitas cores!</p>
      <div class="inicio-arte" id="inicio-arte" aria-hidden="true"></div>
      <div class="inicio-botoes">
        <button class="btn-grande btn-comecar" id="btn-comecar"><span class="ico" data-ico="pincel"></span>COMEÇAR A COLORIR!</button>
        <button class="btn-grande btn-galeria" id="btn-galeria"><span class="ico" data-ico="grade"></span>GALERIA</button>
      </div>
    </div>
  </section>

  <!-- ============ GALERIA ============ -->
  <section id="tela-galeria" class="tela" aria-label="Galeria de desenhos">
    <header class="barra">
      <button class="btn-redondo" id="btn-galeria-voltar" aria-label="Voltar ao início"><span class="ico" data-ico="casa"></span></button>
      <h2 class="barra-titulo"><span class="ico" data-ico="grade"></span> Galeria</h2>
      <div class="barra-direita">
        <span class="contador-total" id="contador-total" aria-label="Desenhos concluídos"></span>
      </div>
    </header>
    <nav class="abas" id="abas" aria-label="Coleções"></nav>
    <h3 class="colecao-nome" id="colecao-nome"></h3>
    <div class="grade" id="grade"></div>
  </section>

  <!-- ============ PINTURA ============ -->
  <section id="tela-pintura" class="tela" aria-label="Pintar desenho">
    <header class="barra barra-pintura">
      <button class="btn-redondo" id="btn-voltar" aria-label="Voltar para a galeria"><span class="ico" data-ico="voltar"></span></button>
      <div class="pintura-info">
        <span class="chip-colecao" id="chip-colecao"></span>
        <span class="num-desenho" id="num-desenho"></span>
      </div>
      <div class="barra-direita">
        <button class="btn-redondo" id="btn-som" aria-label="Ligar ou desligar o som" data-acao="som"></button>
        <button class="btn-redondo" id="btn-tela-cheia" aria-label="Tela cheia"><span class="ico" data-ico="telacheia"></span></button>
      </div>
    </header>
    <div class="pintura-corpo">
      <div class="palco" id="palco">
        <div class="papel" id="papel"></div>
      </div>
      <aside class="painel" id="painel" aria-label="Ferramentas e cores">
        <div class="ferramentas" id="ferramentas">
          <button class="ferr ativa" data-ferr="balde" aria-label="Pintar"><span class="ico" data-ico="balde"></span></button>
          <button class="ferr" data-ferr="borracha" aria-label="Borracha"><span class="ico" data-ico="borracha"></span></button>
          <button class="ferr" id="btn-desfazer" aria-label="Desfazer"><span class="ico" data-ico="desfazer"></span></button>
          <button class="ferr" id="btn-refazer" aria-label="Refazer"><span class="ico" data-ico="refazer"></span></button>
          <button class="ferr" id="btn-zoom-mais" aria-label="Aumentar"><span class="ico" data-ico="zoommais"></span></button>
          <button class="ferr" id="btn-zoom-menos" aria-label="Diminuir"><span class="ico" data-ico="zoommenos"></span></button>
          <button class="ferr" id="btn-zoom-ajustar" aria-label="Ajustar desenho na tela"><span class="ico" data-ico="ajustar"></span></button>
          <button class="ferr ferr-vermelha" id="btn-limpar" aria-label="Limpar desenho"><span class="ico" data-ico="lixo"></span></button>
          <button class="ferr ferr-azul" id="btn-salvar" aria-label="Salvar imagem"><span class="ico" data-ico="salvar"></span></button>
          <button class="ferr ferr-estrela" id="btn-terminei" aria-label="Terminei!"><span class="ico" data-ico="estrela"></span></button>
        </div>
        <div class="cor-atual-linha">
          <span class="cor-atual" id="cor-atual" aria-hidden="true"></span>
          <span class="cor-atual-ico" id="cor-atual-ico"><span class="ico" data-ico="balde"></span></span>
        </div>
        <div class="paleta" id="paleta" role="radiogroup" aria-label="Cores"></div>
      </aside>
    </div>
  </section>

  <!-- ============ JANELAS ============ -->
  <div class="janela" id="janela-confirmar" role="dialog" aria-modal="true" aria-labelledby="confirmar-texto" hidden>
    <div class="janela-caixa">
      <div class="janela-ico" id="confirmar-ico"><span class="ico" data-ico="lixo"></span></div>
      <p class="janela-texto" id="confirmar-texto">Apagar?</p>
      <div class="janela-botoes">
        <button class="btn-grande btn-nao" id="confirmar-nao" aria-label="Não"><span class="ico" data-ico="x"></span></button>
        <button class="btn-grande btn-sim" id="confirmar-sim" aria-label="Sim"><span class="ico" data-ico="check"></span></button>
      </div>
    </div>
  </div>

  <div class="festa" id="festa" hidden>
    <div class="festa-estrelas" id="festa-estrelas"></div>
    <div class="festa-caixa">
      <div class="festa-mini" id="festa-mini"></div>
      <p class="festa-msg" id="festa-msg">Que lindo!</p>
      <div class="festa-botoes">
        <button class="btn-grande btn-sim" id="festa-ok" aria-label="Continuar"><span class="ico" data-ico="check"></span></button>
        <button class="btn-grande btn-galeria" id="festa-galeria" aria-label="Escolher outro desenho"><span class="ico" data-ico="grade"></span></button>
      </div>
    </div>
  </div>

  <div class="janela" id="janela-config" role="dialog" aria-modal="true" aria-labelledby="config-titulo" hidden>
    <div class="janela-caixa">
      <h3 id="config-titulo">Opções do professor</h3>
      <p class="config-info">O progresso fica salvo só neste aparelho. Nenhum dado pessoal é coletado.</p>
      <button class="btn-grande btn-nao btn-largo" id="btn-apagar-tudo"><span class="ico" data-ico="lixo"></span>Apagar todo o progresso</button>
      <button class="btn-grande btn-sim btn-largo" id="btn-config-fechar"><span class="ico" data-ico="check"></span>Fechar</button>
    </div>
  </div>

  <div class="aviso" id="aviso" role="status" aria-live="polite"></div>

  <script src="js/icones.js"></script>
  <script src="js/art/core.js"></script>
  <script src="js/art/people.js"></script>
  <script src="js/art/props.js"></script>
  <script src="js/desenhos/registro.js"></script>
  <script src="js/desenhos/colecao1.js"></script>
  <script src="js/desenhos/colecao2.js"></script>
  <script src="js/desenhos/colecao3.js"></script>
  <script src="js/desenhos/colecao4.js"></script>
  <script src="js/desenhos/colecao5.js"></script>
  <script src="js/paleta.js"></script>
  <script src="js/salvar.js"></script>
  <script src="js/som.js"></script>
  <script src="js/pintura.js"></script>
  <script src="js/galeria.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
