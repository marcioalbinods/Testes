<!doctype html><html><head><meta charset="utf-8"><title>preview</title>
<style>body{margin:0;background:#ddd;font:14px sans-serif}#o{display:grid;grid-template-columns:repeat(var(--c,3),1fr);gap:4px}#o div{background:#fff}#o svg{width:100%;display:block}</style></head>
<body><div id="o"></div>
<script src="../js/art/core.js"></script><script src="../js/art/people.js"></script><script src="../js/art/props.js"></script><script src="../js/art/scenery.js"></script>
<script src="../js/desenhos/registro.js"></script>
<script src="../js/desenhos/colecao1.js"></script><script src="../js/desenhos/colecao2.js"></script><script src="../js/desenhos/colecao3.js"></script><script src="../js/desenhos/colecao4.js"></script><script src="../js/desenhos/colecao5.js"></script><script src="../js/desenhos/colecao6.js"></script><script src="../js/desenhos/colecao7.js"></script><script src="../js/desenhos/colecao8.js"></script><script src="../js/desenhos/colecao9.js"></script><script src="../js/desenhos/colecao10.js"></script>
<script>
const q=new URLSearchParams(location.search);const col=+q.get('col')||1, from=+(q.get('from')||1), to=+(q.get('to')||10);
document.documentElement.style.setProperty('--c',q.get('cols')||3);
AA.DESENHOS.filter(d=>d.col===col&&d.n>=from&&d.n<=to).forEach(d=>{const e=document.createElement('div');try{e.innerHTML=AA.svgDe(d);}catch(err){e.textContent=d.id+' ERRO '+err.message;console.error(d.id,err.stack)}o.appendChild(e)});
</script></body></html>
