<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Frequência Escolar</title>
  <style>
    body { margin: 0; font-family: "Segoe UI", Roboto, -apple-system, Arial, sans-serif; background: #f5f7fb; color: #0f172a; }
    .caixa { max-width: 520px; margin: 12vh auto 0; background: #fff; border: 1px solid #e2e8f0; border-radius: 14px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, .08); padding: 32px 28px; text-align: center; }
    .logo { width: 64px; height: 64px; }
    .marca { font-weight: 800; letter-spacing: .03em; color: #1e3a8a; margin: 10px 0 2px; }
    .sub { font-size: 13px; color: #64748b; margin-bottom: 22px; }
    h1 { font-size: 20px; margin: 0 0 10px; }
    p { color: #475569; line-height: 1.5; margin: 0 0 20px; }
    a.btn { display: inline-block; background: #1d4ed8; color: #fff; text-decoration: none; padding: 12px 20px; border-radius: 8px; font-weight: 700; }
    @media (max-width: 560px) { .caixa { margin: 0; min-height: 100vh; border-radius: 0; border: 0; padding-top: 18vh; } }
  </style>
</head>
<body>
  <div class="caixa">
    <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
      <rect x="2" y="2" width="60" height="60" rx="14" fill="#1d4ed8"/>
      <rect x="15" y="14" width="34" height="38" rx="5" fill="#fff"/>
      <rect x="24" y="10" width="16" height="8" rx="3" fill="#bfdbfe"/>
      <path d="M21 28l4 4 7-8M21 41l4 4 7-8" stroke="#16a34a" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="35" y="27" width="9" height="3.4" rx="1.7" fill="#94a3b8"/>
      <rect x="35" y="40" width="9" height="3.4" rx="1.7" fill="#94a3b8"/>
    </svg>
    <div class="marca">FREQUÊNCIA ESCOLAR</div>
    <div class="sub">Controle de Frequência e Acompanhamento dos Estudantes</div>
    <h1><?= titulo ?></h1>
    <p><?= texto ?></p>
    <a class="btn" href="https://accounts.google.com/AccountChooser" target="_top">Trocar de conta Google</a>
  </div>
</body>
</html>
