<style>
/* ==========================================================================
   FREQUÊNCIA ESCOLAR — Identidade visual
   Azul (principal) · Branco (fundo) · Cinza claro (divisões)
   Verde = presença · Vermelho = ausência · Amarelo = atraso · Azul-claro = justificada
   ========================================================================== */
:root {
  --azul: #1d4ed8;
  --azul-hover: #1e40af;
  --azul-escuro: #1e3a8a;
  --azul-suave: #eff6ff;
  --azul-borda: #bfdbfe;
  --fundo: #ffffff;
  --fundo-app: #f5f7fb;
  --texto: #0f172a;
  --texto-2: #475569;
  --texto-3: #64748b;
  --divisao: #e2e8f0;
  --divisao-2: #cbd5e1;
  --verde: #15803d;   --verde-forte: #16a34a; --verde-bg: #dcfce7;
  --vermelho: #b91c1c; --vermelho-forte: #dc2626; --vermelho-bg: #fee2e2;
  --amarelo: #854d0e;  --amarelo-forte: #facc15; --amarelo-bg: #fef9c3;
  --just: #075985;     --just-forte: #7dd3fc;   --just-bg: #e0f2fe;
  --neutro-bg: #f1f5f9;
  --raio: 10px;
  --raio-sm: 7px;
  --sombra: 0 1px 2px rgba(15, 23, 42, .06), 0 2px 8px rgba(15, 23, 42, .05);
  --sombra-alta: 0 10px 30px rgba(15, 23, 42, .18);
  --sidebar: 248px;
  --topbar: 64px;
  --bottomnav: 64px;
  --fonte: "Segoe UI", Roboto, -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; font-family: var(--fonte); font-size: 15px; line-height: 1.45;
  color: var(--texto); background: var(--fundo-app);
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--azul); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg.ic { width: 20px; height: 20px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* ------------------------------------------------------------------ Estrutura */
.app { min-height: 100vh; }
.sidebar {
  position: fixed; inset: 0 auto 0 0; width: var(--sidebar); background: var(--fundo);
  border-right: 1px solid var(--divisao); display: none; flex-direction: column; z-index: 30;
}
.marca { display: flex; gap: 12px; align-items: center; padding: 18px 18px 16px; border-bottom: 1px solid var(--divisao); }
.marca-logo { width: 40px; height: 40px; flex: none; }
.marca-nome { font-weight: 800; letter-spacing: .02em; font-size: 15px; color: var(--azul-escuro); line-height: 1.15; }
.marca-sub { font-size: 11px; color: var(--texto-3); line-height: 1.25; margin-top: 2px; }
.nav { padding: 12px 10px; display: flex; flex-direction: column; gap: 2px; flex: 1; overflow-y: auto; }
.nav-item {
  display: flex; align-items: center; gap: 12px; width: 100%; border: 0; background: none; text-align: left;
  padding: 11px 12px; border-radius: var(--raio-sm); color: var(--texto-2); font-weight: 600; font-size: 14.5px;
}
.nav-item:hover { background: var(--neutro-bg); color: var(--texto); }
.nav-item.ativo { background: var(--azul-suave); color: var(--azul); }
.nav-item.destaque { background: var(--azul); color: #fff; margin-bottom: 8px; }
.nav-item.destaque:hover { background: var(--azul-hover); }
.nav-rodape { padding: 14px 18px; border-top: 1px solid var(--divisao); font-size: 12px; color: var(--texto-3); }

.principal { min-height: 100vh; padding-bottom: calc(var(--bottomnav) + env(safe-area-inset-bottom)); }
.topbar {
  position: sticky; top: 0; z-index: 20; height: var(--topbar); background: rgba(255, 255, 255, .96);
  backdrop-filter: saturate(1.4) blur(6px); -webkit-backdrop-filter: saturate(1.4) blur(6px);
  border-bottom: 1px solid var(--divisao); display: flex; align-items: center; gap: 12px; padding: 0 16px;
}
.topbar .marca-logo { width: 34px; height: 34px; }
.topbar-titulo { min-width: 0; flex: 1; }
.topbar-titulo .t1 { overflow: hidden; text-overflow: ellipsis; font-weight: 800; color: var(--azul-escuro); font-size: 14px; letter-spacing: .02em; white-space: nowrap; }
.topbar-titulo .t2 { font-size: 12px; color: var(--texto-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sel-turma { display: flex; align-items: center; gap: 8px; }
.sel-turma select { max-width: 200px; }
.usuario-chip {
  display: flex; align-items: center; gap: 8px; padding: 4px 10px 4px 4px; border-radius: 999px;
  background: var(--neutro-bg); font-size: 13px; color: var(--texto-2); max-width: 240px;
}
.avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--azul); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 12px; flex: none; }
.usuario-chip .nome { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.conteudo { padding: 18px 16px 28px; max-width: 1280px; margin: 0 auto; }
.bottomnav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--fundo); border-top: 1px solid var(--divisao);
  display: flex; padding-bottom: env(safe-area-inset-bottom); height: calc(var(--bottomnav) + env(safe-area-inset-bottom));
}
.bottomnav button {
  flex: 1; border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3px; font-size: 11.5px; font-weight: 600; color: var(--texto-3); padding: 6px 2px;
}
.bottomnav button.ativo { color: var(--azul); }
.bottomnav button svg.ic { width: 23px; height: 23px; }

@media (min-width: 1024px) {
  .sidebar { display: flex; }
  .principal { margin-left: var(--sidebar); padding-bottom: 0; }
  .bottomnav, .topbar .marca-logo.so-mobile { display: none; }
  .topbar { padding: 0 24px; }
  .conteudo { padding: 24px 28px 40px; }
}
@media (max-width: 640px) {
  .topbar-titulo .t2 { display: none; }
  .usuario-chip .nome { display: none; }
  .usuario-chip { padding: 3px; }
  .sel-turma select { max-width: 150px; }
}
@media (max-width: 480px) {
  .topbar { gap: 8px; padding: 0 12px; }
  .topbar-titulo { display: none; }
  .sel-turma { flex: 1; min-width: 0; }
  .sel-turma select { max-width: none; }
}

/* ------------------------------------------------------------------ Componentes */
.cabecalho-pagina { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
.cabecalho-pagina h1 { margin: 0; font-size: 22px; letter-spacing: -.01em; }
.cabecalho-pagina .sub { color: var(--texto-3); font-size: 14px; margin-top: 2px; }
h2.secao { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--texto-2); margin: 26px 0 10px; font-weight: 800; }
.card { background: var(--fundo); border: 1px solid var(--divisao); border-radius: var(--raio); box-shadow: var(--sombra); }
.card-corpo { padding: 16px; }
.card-titulo { font-weight: 700; font-size: 15px; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
.grade { display: grid; gap: 14px; }
.grade-kpi { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
.grade-2 { grid-template-columns: 1fr; }
@media (min-width: 900px) { .grade-2 { grid-template-columns: 1.4fr 1fr; } }
.kpi { padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; position: relative; overflow: hidden; }
.kpi .rotulo { font-size: 12.5px; color: var(--texto-3); font-weight: 600; display: flex; align-items: center; gap: 6px; }
.kpi .valor { font-size: 28px; font-weight: 800; letter-spacing: -.02em; line-height: 1.1; }
.kpi .det { font-size: 12px; color: var(--texto-3); }
.kpi::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--kpi-cor, var(--azul)); }
.kpi.verde { --kpi-cor: var(--verde-forte); } .kpi.vermelho { --kpi-cor: var(--vermelho-forte); }
.kpi.amarelo { --kpi-cor: #eab308; } .kpi.just { --kpi-cor: #38bdf8; } .kpi.cinza { --kpi-cor: var(--divisao-2); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px; padding: 0 16px;
  border-radius: var(--raio-sm); border: 1px solid var(--divisao-2); background: var(--fundo); color: var(--texto);
  font-weight: 650; font-size: 14.5px; white-space: nowrap; transition: background .12s, border-color .12s, opacity .12s;
}
.btn:hover { background: var(--neutro-bg); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-primario { background: var(--azul); border-color: var(--azul); color: #fff; }
.btn-primario:hover { background: var(--azul-hover); }
.btn-sucesso { background: var(--verde-forte); border-color: var(--verde-forte); color: #fff; }
.btn-sucesso:hover { background: var(--verde); }
.btn-perigo { background: var(--fundo); border-color: #fecaca; color: var(--vermelho); }
.btn-perigo:hover { background: var(--vermelho-bg); }
.btn-perigo-cheio { background: var(--vermelho-forte); border-color: var(--vermelho-forte); color: #fff; }
.btn-grande { min-height: 52px; padding: 0 22px; font-size: 16px; }
.btn-sm { min-height: 34px; padding: 0 10px; font-size: 13px; }
.btn-link { border: 0; background: none; color: var(--azul); padding: 0; min-height: 0; font-weight: 600; text-align: left; white-space: normal; }
.btn-link:hover { text-decoration: underline; background: none; }

.campo { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.campo label { font-size: 12.5px; font-weight: 700; color: var(--texto-2); }
.campo .ajuda { font-size: 12px; color: var(--texto-3); }
input[type=text], input[type=email], input[type=date], input[type=number], select, textarea {
  min-height: 42px; padding: 8px 11px; border: 1px solid var(--divisao-2); border-radius: var(--raio-sm);
  background: var(--fundo); width: 100%; font-size: 15px;
}
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 3px solid rgba(29, 78, 216, .25); outline-offset: 1px; border-color: var(--azul); }
textarea { min-height: 90px; resize: vertical; }
.filtros { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); align-items: end; }
.linha-acoes { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

.etiqueta { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 700; white-space: nowrap; }
.et-PRESENTE { background: var(--verde-bg); color: var(--verde); }
.et-AUSENTE { background: var(--vermelho-bg); color: var(--vermelho); }
.et-ATRASADO { background: var(--amarelo-bg); color: var(--amarelo); }
.et-JUSTIFICADA { background: var(--just-bg); color: var(--just); }
.et-NAO_REGISTRADO, .et-INATIVO { background: var(--neutro-bg); color: var(--texto-3); }
.et-FINALIZADA { background: var(--verde-bg); color: var(--verde); }
.et-RASCUNHO { background: var(--amarelo-bg); color: var(--amarelo); }
.et-ATIVO { background: var(--azul-suave); color: var(--azul); }
.et-alerta { background: var(--vermelho-bg); color: var(--vermelho); }

.aviso { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: var(--raio-sm); font-size: 14px; border: 1px solid; margin-bottom: 14px; }
.aviso svg.ic { margin-top: 1px; }
.aviso-info { background: var(--azul-suave); border-color: var(--azul-borda); color: var(--azul-escuro); }
.aviso-atencao { background: #fffbeb; border-color: #fde68a; color: #78350f; }
.aviso-erro { background: var(--vermelho-bg); border-color: #fecaca; color: #7f1d1d; }
.aviso-ok { background: #f0fdf4; border-color: #bbf7d0; color: #14532d; }
.aviso .acoes { margin-top: 8px; display: flex; gap: 8px; flex-wrap: wrap; }

.tabela-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table.tabela { width: 100%; border-collapse: collapse; font-size: 14px; }
.tabela th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--texto-3); font-weight: 700; padding: 10px 12px; border-bottom: 1px solid var(--divisao); background: #f8fafc; white-space: nowrap; }
.tabela td { padding: 10px 12px; border-bottom: 1px solid var(--divisao); vertical-align: middle; }
.tabela tr:last-child td { border-bottom: 0; }
.tabela tr.clicavel { cursor: pointer; }
.tabela tr.clicavel:hover td { background: #f8fafc; }
.tabela .num { text-align: right; font-variant-numeric: tabular-nums; }
.tabela .baixo { color: var(--vermelho); font-weight: 800; }
.vazio { padding: 28px 16px; text-align: center; color: var(--texto-3); }
.vazio svg.ic { width: 34px; height: 34px; color: var(--divisao-2); margin-bottom: 6px; }

.paginacao { display: flex; gap: 8px; align-items: center; justify-content: flex-end; padding: 12px; font-size: 13px; color: var(--texto-3); }
.carregando { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 40px; color: var(--texto-3); }
.spinner { width: 22px; height: 22px; border-radius: 50%; border: 3px solid var(--azul-borda); border-top-color: var(--azul); animation: girar .8s linear infinite; }
@keyframes girar { to { transform: rotate(360deg); } }

/* ------------------------------------------------------------------ Painel */
.boas-vindas { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 16px; align-items: center; padding: 18px 20px;
  background: linear-gradient(120deg, var(--azul-escuro), var(--azul)); color: #fff; border: 0; }
.boas-vindas .escola { font-size: 12.5px; opacity: .85; text-transform: uppercase; letter-spacing: .06em; font-weight: 700; }
.boas-vindas .ola { font-size: 21px; font-weight: 800; margin: 2px 0; }
.boas-vindas .info { font-size: 14px; opacity: .92; }
.boas-vindas .btn { background: #fff; color: var(--azul-escuro); border-color: #fff; }
.grafico svg { width: 100%; height: auto; display: block; }
.legenda { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12.5px; color: var(--texto-2); margin-top: 8px; }
.legenda i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.donut-wrap { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
.donut-wrap svg { width: 150px; height: 150px; flex: none; }
.lista-alerta { list-style: none; margin: 0; padding: 0; }
.lista-alerta li { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--divisao); }
.lista-alerta li:last-child { border-bottom: 0; }
.lista-alerta .n { width: 30px; height: 30px; border-radius: 50%; background: var(--neutro-bg); display: grid; place-items: center; font-size: 12px; font-weight: 700; color: var(--texto-2); flex: none; }
.lista-alerta .nome { flex: 1; min-width: 0; font-weight: 600; }
.barra-pct { height: 6px; background: var(--neutro-bg); border-radius: 99px; overflow: hidden; margin-top: 5px; }
.barra-pct span { display: block; height: 100%; background: var(--vermelho-forte); }

/* Painel "Chamadas de hoje" */
.progresso-dia { height: 10px; background: var(--neutro-bg); border-radius: 99px; overflow: hidden; margin: -2px 0 12px; }
.progresso-dia span { display: block; height: 100%; background: var(--verde-forte); transition: width .3s; }
.grade-turmas { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.ficha-turma { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 12px 14px; text-align: left; border-left: 5px solid var(--divisao-2); min-height: 92px; }
.ficha-turma:hover { border-color: var(--azul); }
.ficha-turma .ft-nome { font-size: 20px; font-weight: 800; color: var(--texto); }
.ficha-turma .ft-status { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 700; color: var(--texto-3); }
.ficha-turma .ft-status svg.ic { width: 16px; height: 16px; }
.ficha-turma .ft-det { font-size: 12px; color: var(--texto-3); }
.ficha-turma.st-FINALIZADA { border-left-color: var(--verde-forte); background: #f6fef9; }
.ficha-turma.st-FINALIZADA .ft-status { color: var(--verde); }
.ficha-turma.st-EM_ANDAMENTO { border-left-color: #eab308; background: #fffdf0; }
.ficha-turma.st-EM_ANDAMENTO .ft-status { color: var(--amarelo); }
@media (max-width: 640px) { .grade-turmas { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

.grupo-ausentes { margin-bottom: 12px; overflow: hidden; }
@media print { .grupo-ausentes { break-inside: avoid; box-shadow: none; } }

/* ------------------------------------------------------------------ Chamada */
.chamada-topo { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); align-items: end; margin-bottom: 14px; }
.contadores {
  position: sticky; top: var(--topbar); z-index: 15; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px;
  padding: 10px 0; background: var(--fundo-app); margin-bottom: 6px;
}
.contador { background: var(--fundo); border: 1px solid var(--divisao); border-radius: var(--raio-sm); padding: 8px 6px; text-align: center; }
.contador .v { font-size: 22px; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; }
.contador .r { font-size: 11px; font-weight: 700; color: var(--texto-3); text-transform: uppercase; letter-spacing: .03em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.contador.c-P { border-bottom: 3px solid var(--verde-forte); } .contador.c-P .v { color: var(--verde); }
.contador.c-A { border-bottom: 3px solid var(--vermelho-forte); } .contador.c-A .v { color: var(--vermelho); }
.contador.c-T { border-bottom: 3px solid var(--amarelo-forte); } .contador.c-T .v { color: var(--amarelo); }
.contador.c-J { border-bottom: 3px solid var(--just-forte); } .contador.c-J .v { color: var(--just); }
.contador.c-N { border-bottom: 3px solid var(--divisao-2); }
.contador.c-N.pendente .v { color: var(--vermelho); }
.contador .curto { display: none; }
.acoes-lista { margin-bottom: 4px; }
@media (max-width: 640px) {
  .contadores { gap: 4px; padding: 6px 0; }
  .contador { padding: 5px 2px; }
  .contador .v { font-size: 18px; }
  .contador .longo { display: none; }
  .contador .curto { display: inline; }
  .acoes-lista { display: grid; grid-template-columns: 1fr 1fr; }
  .acoes-lista .btn { white-space: normal; line-height: 1.15; padding: 4px 8px; }
}

.status-salvamento { display: inline-flex; align-items: center; gap: 7px; font-size: 13.5px; font-weight: 650; padding: 6px 12px; border-radius: 999px; background: var(--neutro-bg); color: var(--texto-2); }
.status-salvamento .ponto { width: 9px; height: 9px; border-radius: 50%; background: var(--divisao-2); }
.status-salvamento.salvando .ponto { background: var(--azul); animation: pulsar 1s infinite; }
.status-salvamento.salvo { background: var(--verde-bg); color: var(--verde); } .status-salvamento.salvo .ponto { background: var(--verde-forte); }
.status-salvamento.pendente { background: var(--amarelo-bg); color: var(--amarelo); } .status-salvamento.pendente .ponto { background: #eab308; }
.status-salvamento.erro, .status-salvamento.offline { background: var(--vermelho-bg); color: var(--vermelho); } .status-salvamento.erro .ponto, .status-salvamento.offline .ponto { background: var(--vermelho-forte); }
@keyframes pulsar { 50% { opacity: .3; } }

.lista-chamada { background: var(--fundo); border: 1px solid var(--divisao); border-radius: var(--raio); box-shadow: var(--sombra); overflow: hidden; }
.lc-cabecalho, .lc-linha { display: grid; grid-template-columns: 56px minmax(0, 1fr) repeat(4, 118px); gap: 8px; align-items: center; padding: 8px 14px; }
.lc-cabecalho { background: #f8fafc; border-bottom: 1px solid var(--divisao); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--texto-3); font-weight: 700; }
.lc-cabecalho span:nth-child(n+3) { text-align: center; }
.lc-linha { border-bottom: 1px solid var(--divisao); transition: background .15s; }
.lc-linha:last-child { border-bottom: 0; }
.lc-linha.s-NAO_REGISTRADO { background: #fff; }
.lc-linha.s-PRESENTE { background: #f6fef9; } .lc-linha.s-AUSENTE { background: #fff7f7; }
.lc-linha.s-ATRASADO { background: #fffdf0; } .lc-linha.s-JUSTIFICADA { background: #f5fbff; }
.lc-num { width: 40px; height: 40px; border-radius: 50%; background: var(--neutro-bg); display: grid; place-items: center; font-weight: 800; font-size: 15px; color: var(--texto-2); font-variant-numeric: tabular-nums; }
.s-PRESENTE .lc-num { background: var(--verde-forte); color: #fff; } .s-AUSENTE .lc-num { background: var(--vermelho-forte); color: #fff; }
.s-ATRASADO .lc-num { background: var(--amarelo-forte); color: #422006; } .s-JUSTIFICADA .lc-num { background: var(--just-forte); color: #0c4a6e; }
